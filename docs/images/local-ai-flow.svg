<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 155" role="img" aria-labelledby="local-flow-title local-flow-desc"><title id="local-flow-title">让 AI 部署本地听记</title><desc id="local-flow-desc">复制下方指令给 AI，AI 下载源码并安装运行环境，之后通过本机地址打开听记。</desc><defs><marker id="local-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" fill="#62765a"/></marker></defs><g fill="#f1f3ec" stroke="#bfcbb7"><rect x="10" y="25" width="190" height="70" rx="8"/><rect x="265" y="25" width="190" height="70" rx="8"/><rect x="520" y="25" width="190" height="70" rx="8"/></g><g stroke="#62765a" marker-end="url(#local-arrow)"><path d="M211 60H251"/><path d="M466 60H506"/></g><g fill="#393d34" text-anchor="middle" font-size="18"><text x="105" y="65">把指令交给 AI</text><text x="360" y="65">下载并安装</text><text x="615" y="65">打开本机网页</text></g><text x="360" y="128" text-anchor="middle" fill="#777b6f" font-size="14">笔记和文件保存在自己的电脑</text></svg>
