<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>听记 · 调整笔记提示词</title>
  <link rel="stylesheet" href="/knowledge.css"><link rel="stylesheet" href="/prompt-lab.css">
  <link rel="stylesheet" href="/vendor/katex/katex.min.css">
  <script defer src="/vendor/katex/katex.min.js"></script>
  <script type="module" src="/prompt-lab.js"></script>
</head>
<body>
  <main>
    <header><a href="/">← 听记</a><span id="course-name">调整笔记提示词</span></header>
    <section aria-label="修改提示词">
      <h1>想把笔记改成什么样？</h1>
      <label for="intent">改动方向</label>
      <textarea id="intent" rows="3" placeholder="例如：先直观解释矩阵变换，再给公式；少用列表，多解释推导之间的联系。"></textarea>
      <div class="actions"><button id="update" disabled>更新提示词</button><span id="status" role="status" aria-live="polite">正在读取…</span></div>
      <label for="prompt">实际发给 DeepSeek 的系统提示词</label>
      <textarea id="prompt" rows="18" spellcheck="false" maxlength="30000"></textarea>
      <p class="muted">更新会保存为后续课堂笔记的共同规则。下方笔记通过“从原文重新生成”更新。</p>
      <div class="actions"><button id="generate" disabled>从原文重新生成</button><span class="muted">DeepSeek V4.1 Flash</span></div>
    </section>
    <section class="reading" aria-label="笔记预览">
      <div class="reading-head"><h2>笔记</h2><label for="versions" class="sr-only">查看笔记版本</label><select id="versions"><option value="current">当前笔记</option></select></div>
      <article id="preview"></article>
    </section>
    <details id="original-details"><summary>查看保留的转录原文</summary><pre id="original">展开后读取</pre></details>
  </main>
</body>
</html>
